# Postgres 16 + pgvector for Living Brain.
# `pgvector/pgvector:pg16` ships the `vector` extension; `pg_trgm` is bundled
# with Postgres itself. Both are enabled by migrations/0001_init.sql.
services:
  db:
    image: pgvector/pgvector:pg16
    container_name: living-brain-db
    environment:
      POSTGRES_USER: brain
      POSTGRES_PASSWORD: brain
      POSTGRES_DB: brain
    ports:
      - "5433:5432"
    volumes:
      - brain-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U brain -d brain"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  brain-pgdata:
