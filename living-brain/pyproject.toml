[project]
name = "living-brain"
version = "0.1.0"
description = "A local, private second brain with nightly memory consolidation, powered by Ollama."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
# Runtime uses only the Python standard library so `uv sync` is fast and works
# fully offline. Ollama is reached over plain HTTP via urllib; there is no hard
# dependency on any third-party client.
dependencies = []

[project.scripts]
brain = "living_brain.cli:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/living_brain"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
