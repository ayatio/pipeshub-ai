[project]
name = "living-brain"
version = "0.1.0"
description = "Living Brain — an autonomous memory & nightly-reflection engine backed by local Ollama models."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.1"]
dev = ["pytest>=8.0"]

[project.scripts]
brain = "living_brain.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/living_brain"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
