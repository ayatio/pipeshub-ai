[project]
name = "living-brain"
version = "0.1.0"
description = "A local-first 'living brain' — ingest notes, embed them, and consolidate memories nightly like sleep."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "living-brain" }]
dependencies = [
    "click>=8.1",
    "httpx>=0.27",
    "numpy>=1.26",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
# Production backend: Postgres + pgvector. Not needed for the default SQLite path.
postgres = [
    "psycopg[binary]>=3.1",
    "pgvector>=0.3",
]
dev = [
    "pytest>=8.0",
]

[project.scripts]
brain = "living_brain.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/living_brain"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
